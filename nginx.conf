# Один адрес для сайта и API: статика из сборки Next.js, /api - на сервер
server {
  listen 80;
  root /usr/share/nginx/html;
  # /orders -> /orders/ (сборка со слешем на конце): редирект относительный, иначе nginx подставит свой порт 80
  # и на http://localhost:8080 ссылка уведет на http://localhost/orders/
  absolute_redirect off;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ $uri.html /index.html;
  }
}
