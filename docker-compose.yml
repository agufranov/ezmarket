# Весь проект одной командой: docker compose up --build
#   сайт      http://localhost:8080
#   письма    http://localhost:8025 (Mailpit - коды входа видно здесь)
# Тесты сервера: docker compose run --rm test
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ezmarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ezmarket}
      POSTGRES_DB: ezmarket
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezmarket -d ezmarket"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    environment:
      # на открытом сервере - обязательно "логин:пароль", иначе чужие коды входа видны всем
      MP_UI_AUTH: ${MAILPIT_UI_AUTH:-}
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  api:
    build:
      context: ./server
      target: runtime
    environment:
      DATABASE_URL: postgresql://ezmarket:${POSTGRES_PASSWORD:-ezmarket}@db:5432/ezmarket
      # пусто - сервер сгенерирует секрет при первом старте и сохранит в томе apidata
      AUTH_CODE_SECRET: ${AUTH_CODE_SECRET:-}
      # локально сайт открывается по http; на стенде с HTTPS - true
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-EzMarket <no-reply@ezmarket.local>}
      # демо-стенд: код возвращается в ответе и подставляется в поле (в проде - false)
      AUTH_DEMO_CODE: ${AUTH_DEMO_CODE:-false}
      AUTH_RESEND_SECONDS: ${AUTH_RESEND_SECONDS:-60}
      AUTH_CODES_PER_HOUR: ${AUTH_CODES_PER_HOUR:-5}
      # пусто - секрет подписи уведомлений об оплате сгенерируется при первом старте (том apidata)
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      # платежка: fake - встроенная тестовая со страницей оплаты, cryptopay - Crypto Pay (нужен CRYPTOPAY_TOKEN)
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      CRYPTOPAY_TOKEN: ${CRYPTOPAY_TOKEN:-}
      CRYPTOPAY_NETWORK: ${CRYPTOPAY_NETWORK:-testnet}
      # кнопка «Вернуться в магазин» после оплаты в боте (например http://166.88.253.195)
      SITE_URL: ${SITE_URL:-}
      # минимальная сумма заказа в копейках/центах (10000 = 100); меньше - только для проверки оплаты
      ORDER_MIN_AMOUNT: ${ORDER_MIN_AMOUNT:-10000}
      # бонусы за регистрацию и кэшбэк за выполненный заказ в % (1 бонус = 1 ₽)
      BONUS_SIGNUP: ${BONUS_SIGNUP:-100}
      BONUS_CASHBACK_PERCENT: ${BONUS_CASHBACK_PERCENT:-5}
    volumes:
      - apidata:/data
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    build: .
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

  # --- тесты: отдельная база в памяти, поднимается только для docker compose run --rm test ---
  db-test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: ezmarket
      POSTGRES_PASSWORD: ezmarket
      POSTGRES_DB: ezmarket_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ezmarket -d ezmarket_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  test:
    build:
      context: ./server
      target: test
    profiles: ["test"]
    environment:
      TEST_DATABASE_URL: postgresql://ezmarket:ezmarket@db-test:5432/ezmarket_test
    depends_on:
      db-test:
        condition: service_healthy

volumes:
  pgdata:
  apidata:
